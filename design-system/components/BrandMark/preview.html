<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>preview</title>
<style>
body{padding:16px;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:32px;align-items:center}
.logo{height:28px;width:auto;display:block}
.logo-dark{display:none}
[data-theme="dark"] .logo-light{display:none}
[data-theme="dark"] .logo-dark{display:block}
.tag{font-size:.8rem;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.tag b{color:var(--ink)}
.tile{width:42px;height:42px;border-radius:.75rem;display:block}
</style>
</head>
<body>
<div class="row">
  <div>
    <img class="logo logo-light" src="../../assets/Logos/mister-wiz-logo.png" alt="Mister Wiz">
    <img class="logo logo-dark" src="../../assets/Logos/mister-wiz-logo-white.png" alt="Mister Wiz">
    <div class="tag"><b>Wiz Aula</b> · Escola de Líderes</div>
  </div>
  <img class="tile" src="../../assets/Logos/mister-wiz-symbol.png" alt="">
  <img class="tile" style="width:64px;height:64px;border-radius:1rem" src="../../assets/Logos/mister-wiz-symbol.png" alt="">
</div>
<script>/* static preview */</script>
</body>
</html>
